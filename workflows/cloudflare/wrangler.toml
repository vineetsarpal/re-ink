# Production worker. Consumer and cron enabled 2026-11-11 for synthetic validation
# Open access: no org allowlist. Backend owns customer caps (500/2000 defaults)
# and EXTRACTION_UNCAPPED_ORGANIZATION_IDS (customer funding only).
# Kill switch: backend EXTRACTION_GLOBAL_TRIAL_CALL_MONTHLY_LIMIT=0; own keys continue.
# Production open-access deploy waits on #60 and follow-up checks 1-3.
# Scheduler secrets: REINK_{DISPATCH,EXPIRY,CLEANUP,PURGE}_SCHEDULER_TOKEN, all distinct.
# Purge also needs backend CLOUDFLARE_PURGE_TOKEN / CLOUDFLARE_PURGE_DATABASE_URL (reink_cf_purge).
# Set the purge token on both sides before deploying; secrets via `wrangler secret put`.
name = "reink-extraction"
main = "worker.mjs"
compatibility_date = "2025-07-09"
workers_dev = false
preview_urls = false

[vars]
REINK_API_ORIGIN = "https://re-ink.fastapicloud.dev"
LANDINGAI_PARSE_MODEL = "dpt-2-20260903"
LANDINGAI_EXTRACT_MODEL = "extract-20260903"

[triggers]
crons = ["* * * * *"]

[[queues.consumers]]
queue = "reink-extraction"
dead_letter_queue = "reink-extraction-dlq"
max_batch_size = 1
max_concurrency = 1
max_retries = 50
retry_delay = 30

# Secrets (never in this file): REINK_WORKER_TOKEN, REINK_DISPATCH_SCHEDULER_TOKEN,
# REINK_EXPIRY_SCHEDULER_TOKEN, REINK_CLEANUP_SCHEDULER_TOKEN.
